services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a unique database password}"
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - paperclip-db:/var/lib/postgresql/data
  paperclip:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    pids_limit: 2048
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    stop_grace_period: 90s
    environment:
      DATABASE_URL: "postgresql://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip"
      HOST: "0.0.0.0"
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: public
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:?Set the HTTPS public URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?Set a unique secret}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?Set a separate unique secret}"
      PAPERCLIP_TELEMETRY_DISABLED: "1"
    expose:
      - "3100"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy
volumes:
  paperclip-data:
  paperclip-db:
